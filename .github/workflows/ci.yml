name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.module.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - name: root
            path: .
          - name: mongo
            path: ./mongo
          - name: wechat
            path: ./wechat
          - name: tencentocr
            path: ./tencentocr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'

      - name: Verify formatting
        working-directory: ${{ matrix.module.path }}
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        working-directory: ${{ matrix.module.path }}
        run: go test ./...
