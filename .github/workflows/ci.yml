name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.module.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - name: root
            path: .
          - name: download
            path: ./download
          - name: epub
            path: ./epub
          - name: htmlutil
            path: ./htmlutil
          - name: jwt
            path: ./jwt
          - name: localdb
            path: ./localdb
          - name: logger
            path: ./logger
          - name: mongo
            path: ./mongo
          - name: wechat
            path: ./wechat
          - name: tencentocr
            path: ./tencentocr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'

      - name: Verify formatting
        working-directory: ${{ matrix.module.path }}
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        working-directory: ${{ matrix.module.path }}
        run: go vet ./...

      - name: Run tests
        working-directory: ${{ matrix.module.path }}
        run: go test ./...

      - name: Run race detector
        if: matrix.module.name == 'root'
        working-directory: ${{ matrix.module.path }}
        run: go test -race ./...
