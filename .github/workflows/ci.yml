name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.module.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - name: root
            path: .
          - name: download
            path: ./download
          - name: epub
            path: ./epub
          - name: htmlutil
            path: ./htmlutil
          - name: jwt
            path: ./jwt
          - name: localdb
            path: ./localdb
          - name: logger
            path: ./logger
          - name: mongo
            path: ./mongo
          - name: postgres
            path: ./postgres
          - name: wechat
            path: ./wechat
          - name: tencentocr
            path: ./tencentocr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'

      - name: Verify formatting
        working-directory: ${{ matrix.module.path }}
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        working-directory: ${{ matrix.module.path }}
        run: go vet ./...

      - name: Run tests
        working-directory: ${{ matrix.module.path }}
        run: go test ./...

      - name: Run race detector
        if: matrix.module.name == 'root' || matrix.module.name == 'postgres'
        working-directory: ${{ matrix.module.path }}
        run: go test -race ./...

  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: go_utils_test
          POSTGRES_PASSWORD: go_utils_test
          POSTGRES_DB: go_utils_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U go_utils_test -d go_utils_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TEST_DSN: postgres://go_utils_test:go_utils_test@localhost:5432/go_utils_test?sslmode=disable
      GOWORK: 'off'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'

      - name: Run PostgreSQL integration tests
        working-directory: ./postgres
        run: go test -race -run '^TestIntegration' ./...
